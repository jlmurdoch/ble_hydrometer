
# Turn Serial / UART to =n to save more power
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Output
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# LED
CONFIG_GPIO=y
CONFIG_PWM=y

# IMU / CHARGER
CONFIG_SENSOR=y
CONFIG_I2C=y

# Power
CONFIG_REGULATOR=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# nRF1300
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y

# IMU
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LOG_LEVEL_OFF=y

# Retained Register
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

# Flash (to disable)
CONFIG_FLASH=y
CONFIG_SPI_NOR=y